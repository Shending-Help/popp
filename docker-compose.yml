services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: popp
      POSTGRES_PASSWORD: popp
      POSTGRES_DB: popp
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U popp']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ['pgdata:/var/lib/postgresql/data']
volumes:
  pgdata:
